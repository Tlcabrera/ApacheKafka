# Etapa C (sesiones 10-13): Schema Registry + Kafka Connect + PostgreSQL + MinIO
# Uso: docker compose -f docker-compose-lab-kafka.yml -f docker-compose.etapaC.yml up -d
# Schema Registry: http://localhost:8081 · Connect: http://localhost:8083 · MinIO: http://localhost:9001 (minioadmin/minioadmin)
services:
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: schema-registry
    depends_on: [broker1, broker2, broker3]
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker1:19092,broker2:19092,broker3:19092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward   # política institucional por defecto

  connect:
    build:
      context: .
      dockerfile: connect/Dockerfile
    image: dian-kafka-connect:1.0.0
    container_name: connect
    depends_on: [schema-registry, postgres, minio]
    ports: ["8083:8083"]
    environment:
      CONNECT_BOOTSTRAP_SERVERS: broker1:19092,broker2:19092,broker3:19092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: dian-connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
  postgres:
    image: postgres:16
    container_name: postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: dian
      POSTGRES_USER: dian
      POSTGRES_PASSWORD: dian
    # wal_level=logical es requisito de Debezium (sesión 12, paso 5)
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed-declaraciones.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  minio:
    # Etiqueta fija multi-arquitectura; no usar ``latest`` en una práctica evaluable.
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes: ["miniodata:/data"]

  # Lab09 necesita el bucket antes de registrar el sink. El proceso es
  # idempotente y espera a MinIO, por eso no depende de tiempos arbitrarios.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on: [minio]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done
        mc mb --ignore-existing local/dian-bronce
    environment:
      MC_INSECURE: "true"

volumes:
  pgdata:
  miniodata:
