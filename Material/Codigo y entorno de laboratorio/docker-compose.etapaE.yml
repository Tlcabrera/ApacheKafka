# Etapa E - Labs 12 y 13: seguridad didactica con un broker KRaft.
# Incluye TLS, SASL/SCRAM y autorizador ACL. No demuestra replicacion ni alta disponibilidad.
# Ejecutar solo; detener primero los Compose Kafka anteriores.
name: dian-etapae-lab

services:
  broker1:
    image: apache/kafka:3.9.0
    container_name: kafka-etapaE
    ports:
      - "9093:9095"
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
      - datae:/var/lib/kafka/data
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER_SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_SASL_SSL

      KAFKA_LISTENERS: INTERNAL_SASL_SSL://0.0.0.0:19092,EXTERNAL_SASL_SSL://0.0.0.0:9095,CONTROLLER_SASL_SSL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SASL_SSL://broker1:19092,EXTERNAL_SASL_SSL://localhost:9093,CONTROLLER_SASL_SSL://broker1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER_SASL_SSL:SASL_SSL,INTERNAL_SASL_SSL:SASL_SSL,EXTERNAL_SASL_SSL:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: SCRAM-SHA-512
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/broker_jaas.conf

      KAFKA_SSL_KEYSTORE_TYPE: JKS
      KAFKA_SSL_KEYSTORE_FILENAME: broker1.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: creds
      KAFKA_SSL_KEY_CREDENTIALS: creds
      KAFKA_SSL_TRUSTSTORE_TYPE: JKS
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: creds
      KAFKA_SSL_CLIENT_AUTH: requested

      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:admin-kafka

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        if [ ! -f /var/lib/kafka/data/meta.properties ]; then
          printf 'process.roles=%s\n' "$$KAFKA_PROCESS_ROLES" > /tmp/format.properties
          printf 'node.id=%s\n' "$$KAFKA_NODE_ID" >> /tmp/format.properties
          printf 'controller.quorum.voters=%s\n' "$$KAFKA_CONTROLLER_QUORUM_VOTERS" >> /tmp/format.properties
          printf 'controller.listener.names=%s\n' "$$KAFKA_CONTROLLER_LISTENER_NAMES" >> /tmp/format.properties
          printf 'listeners=%s\n' "$$KAFKA_LISTENERS" >> /tmp/format.properties
          printf 'advertised.listeners=%s\n' "$$KAFKA_ADVERTISED_LISTENERS" >> /tmp/format.properties
          printf 'listener.security.protocol.map=%s\n' "$$KAFKA_LISTENER_SECURITY_PROTOCOL_MAP" >> /tmp/format.properties
          printf 'inter.broker.listener.name=%s\n' "$$KAFKA_INTER_BROKER_LISTENER_NAME" >> /tmp/format.properties
          printf 'log.dirs=%s\n' "$$KAFKA_LOG_DIRS" >> /tmp/format.properties
          . /etc/kafka/secrets/scram-credentials.env
          /opt/kafka/bin/kafka-storage.sh format -t "$$CLUSTER_ID" \
            -c /tmp/format.properties --ignore-formatted \
            --add-scram "$$SCRAM_ADMIN_KAFKA" \
            --add-scram "$$SCRAM_SVC_FACTURACION_PROD" \
            --add-scram "$$SCRAM_SVC_ANALITICA_LECTURA"
        fi
        exec /etc/kafka/docker/run
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 --command-config /etc/kafka/secrets/admin.properties > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  bootstrap-topics:
    image: apache/kafka:3.9.0
    container_name: bootstrap-topics-etapaE
    depends_on:
      broker1:
        condition: service_healthy
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker1:19092 \
          --command-config /etc/kafka/secrets/admin.properties \
          --create --if-not-exists --topic dian.facturacion.emitida \
          --partitions 3 --replication-factor 1 --config min.insync.replicas=1

volumes:
  datae:
