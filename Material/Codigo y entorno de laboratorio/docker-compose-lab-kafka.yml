# =============================================================================
# Entorno de laboratorio del curso "Apache Kafka para la gestión de flujos de
# datos en tiempo real" — DIAN / Escuela de Impuestos y Aduanas Nacionales
#
# Etapa A/B: 3 brokers en modo KRaft (sin ZooKeeper) + interfaz de administración
# Uso:  docker compose -f docker-compose-lab-kafka.yml up -d
#       docker compose -f docker-compose-lab-kafka.yml down -v
#
# Requisitos: motor de contenedores libre (Podman, Rancher Desktop o Docker Engine), 8 GB de RAM libres.
# NO usar Docker Desktop: su licencia exige suscripción de pago para entidades de gobierno.
# Interfaz de administración: http://localhost:8080
# Bootstrap para clientes externos: localhost:9092,localhost:9094,localhost:9096
#
# NOTA: entorno de FORMACIÓN. Sin cifrado ni autenticación; se endurece en las
# sesiones 16 y 17. No usar con datos reales de contribuyentes.
# =============================================================================

# NOTA (verificado en Podman 5.8 / macOS ARM, sept. 2026):
# El healthcheck consulta $$(hostname):19092 (listener INTERNO), no localhost:9092.
# Con localhost:9092 solo broker1 pasaba la prueba: los otros dos exponen 9094 y 9096,
# quedaban marcados unhealthy y bloqueaban el arranque de bootstrap-topics.
x-broker-common: &broker-common
  image: apache/kafka:3.9.0
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $$(hostname):19092 > /dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 10
  environment: &broker-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9093,2@broker2:9093,3@broker3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    # Valores alineados con la recomendación del curso: RF=3, ISR mínimo 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # Mantiene los logs y metadatos de KRaft en los volúmenes data1/data2/data3.
    # Sin esta variable, apache/kafka:3.9.0 usa /tmp/kafka-logs y el volumen
    # declarado en /var/lib/kafka/data queda sin utilizar.
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_LOG_RETENTION_HOURS: 168
    CLUSTER_ID: dian-kafka-lab-2026

services:
  broker1:
    <<: *broker-common
    container_name: broker1
    ports: ["9092:9092", "9101:9101"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://broker1:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://broker1:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:19092,EXTERNAL://localhost:9092
    volumes: ["data1:/var/lib/kafka/data"]

  broker2:
    <<: *broker-common
    container_name: broker2
    ports: ["9094:9094", "9102:9102"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://broker2:19092,EXTERNAL://0.0.0.0:9094,CONTROLLER://broker2:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker2:19092,EXTERNAL://localhost:9094
    volumes: ["data2:/var/lib/kafka/data"]

  broker3:
    <<: *broker-common
    container_name: broker3
    ports: ["9096:9096", "9103:9103"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://broker3:19092,EXTERNAL://0.0.0.0:9096,CONTROLLER://broker3:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker3:19092,EXTERNAL://localhost:9096
    volumes: ["data3:/var/lib/kafka/data"]

  kafka-ui:
    # Versión fija multi-arquitectura; actualizar mediante una prueba de regresión.
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    container_name: kafka-ui
    depends_on: [broker1, broker2, broker3]
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: dian-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker1:19092,broker2:19092,broker3:19092
      DYNAMIC_CONFIG_ENABLED: "true"

  # Crea los topics del dominio sintético del curso (Lab 03, paso 5)
  bootstrap-topics:
    image: apache/kafka:3.9.0
    container_name: bootstrap-topics
    depends_on:
      broker1: {condition: service_healthy}
      broker2: {condition: service_healthy}
      broker3: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        B=broker1:19092
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --create --if-not-exists --bootstrap-server $$B \
            --topic dian.facturacion.emitida --partitions 6 --replication-factor 3 \
            --config min.insync.replicas=2 --config retention.ms=2592000000
        $$T --create --if-not-exists --bootstrap-server $$B \
            --topic dian.declaracion.presentada --partitions 6 --replication-factor 3 \
            --config min.insync.replicas=2 --config retention.ms=3888000000
        $$T --create --if-not-exists --bootstrap-server $$B \
            --topic dian.aduanas.declaracion-importacion --partitions 3 --replication-factor 3 \
            --config min.insync.replicas=2
        $$T --create --if-not-exists --bootstrap-server $$B \
            --topic dian.auditoria.acceso --partitions 6 --replication-factor 3 \
            --config cleanup.policy=compact --config min.insync.replicas=2
        echo "--- Topics creados ---"
        $$T --list --bootstrap-server $$B

volumes:
  data1:
  data2:
  data3:
